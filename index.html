<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1c">
<title>異陣對決</title>
<meta name="description" content="雙人策略卡牌對戰：禁用輪抽、盲區佈陣、暗付出招。同一台裝置輪流玩或對戰電腦，離線也能玩。">
<!-- App（PWA）：安裝到主畫面、全螢幕開啟；路徑都用相對路徑，放在網站子目錄（例如 GitHub Pages）也能用 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="異陣對決">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="異陣對決">
<!-- iPhone 主畫面開啟時，畫面延伸到狀態列底下：上方用 env(safe-area-inset-top) 讓開瀏海 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&display=swap&text=%E7%95%B0%E9%99%A3%E5%B0%8D%E6%B1%BA%E7%AC%AC%E5%9B%9E%E5%90%88%E9%A0%90%E5%88%A4%E9%98%B2%E7%A6%A6%E9%80%9F%E5%BA%A6%E5%88%A4%E5%AE%9A%E5%87%BA%E6%8B%9B%E6%9C%AB%E7%B5%90%E7%AE%97%E5%8B%9D%E5%88%A9%E5%B9%B3%E6%89%8B%E4%BD%A0%E8%B4%8F%E4%BA%86%E8%BC%B8%E7%A6%81%E7%94%A8%E9%9A%8E%E6%AE%B5%E8%BC%AA%E6%8A%BD%E9%81%B8%E8%A7%92%E7%9B%B2%E5%8D%80%E4%BD%88%E9%99%A3%E6%9A%97%E4%BB%98%E5%B0%8D%E6%88%B0%E7%B5%90%E6%9D%9F%E5%90%8C%E6%99%82%E6%8F%AD%E6%9B%89%E9%96%8B%E5%A7%8B%E8%AB%8B%E6%8A%8A%E8%A3%9D%E7%BD%AE%E4%BA%A4%E7%B5%A6%E4%B8%8B%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BA%94%E5%85%AD%E4%B8%83%E5%85%AB%E4%B9%9D%E5%8D%81%E3%80%81%EF%BC%81">
<link rel="stylesheet" href="css/cards.css">
<style>
:root {
  --bg: #0b0e1c; --bg2: #121731; --panel: #171d3a; --panel2: #212a52; --line: #2c3668; --line2: #3b4785;
  --text: #edf0fb; --muted: #97a1cb; --accent: #ffcc4d; --accent2: #f0a020; --p0: #55c8ff; --p1: #ff7d7d;
  --hp: #43d17a; --low: #ff4f5e; --shield: #6cc0ff; --danger: #ff5c6c; --good: #43d17a;
  --r: 14px; --sheet-h: 0px;
  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; color: var(--text); background: var(--bg); overflow-x: clip; }
body {
  font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Heiti TC", system-ui, sans-serif;
  font-size: 15px; line-height: 1.45; min-height: 100vh; overflow-x: hidden;
  background:
    radial-gradient(1200px 600px at 50% -10%, #2a2f6a 0%, transparent 60%),
    radial-gradient(800px 500px at 100% 100%, #3a1c4a55 0%, transparent 60%),
    radial-gradient(700px 500px at 0% 80%, #12406055 0%, transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
/* 星塵背景 */
body::before, body::after {
  content: ''; position: fixed; inset: -50%; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 20px 30px, #fff9, transparent 60%),
    radial-gradient(1px 1px at 120px 80px, #fff7, transparent 60%),
    radial-gradient(1.2px 1.2px at 200px 150px, #ffd98a99, transparent 60%),
    radial-gradient(1px 1px at 60px 190px, #9fd8ff88, transparent 60%);
  background-size: 240px 240px;
  animation: drift 120s linear infinite; opacity: .5;
}
body::after { background-size: 380px 380px; animation-duration: 200s; opacity: .35; animation-direction: reverse; }
#app { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 0 max(12px, env(safe-area-inset-right)) calc(40px + var(--sheet-h) + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
/* 安裝成 App（iPhone 狀態列透明）時，狀態列底下鋪一條底色，捲動的內容不會跟時間、電量疊在一起；一般瀏覽器高度是 0 */
#app::before { content: ''; position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px); background: #0b0e1cf2; z-index: 40; pointer-events: none; }
.screen { animation: screenIn .35s var(--ease); }
button { font: inherit; color: inherit; }
input { font: inherit; }
code { background: #0008; padding: 1px 6px; border-radius: 6px; font-size: 14px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.center { text-align: center; }
.bad { color: var(--danger); font-weight: bold; }
.red { color: var(--danger); }

/* ---------- 按鈕 ---------- */
.btn {
  position: relative; display: block; width: 100%; padding: 11px 14px; margin: 8px 0; border-radius: var(--r);
  border: 1px solid var(--line2); background: linear-gradient(180deg, #2a3463, #1f2750); cursor: pointer; text-align: center;
  box-shadow: 0 2px 0 #0006, inset 0 1px 0 #ffffff14; transition: transform .1s, filter .15s, box-shadow .15s; overflow: hidden;
}
.btn:hover:not([disabled]) { filter: brightness(1.15); }
.btn:active:not([disabled]) { transform: translateY(1px) scale(.985); box-shadow: 0 1px 0 #0006; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.primary {
  background: linear-gradient(180deg, #ffe07a, #f7b52c 55%, #e39713); color: #2a1a00; border-color: #ffd257; font-weight: 800;
  box-shadow: 0 3px 0 #9a5d00, 0 6px 18px #f0a02044, inset 0 1px 0 #fff8;
}
.btn.primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, #fff6 50%, transparent 70%); transform: translateX(-120%); animation: shine 3.5s infinite; }
.btn.danger { background: linear-gradient(180deg, #7a2633, #561a25); border-color: #c2414f; }
.btn.big { padding: 14px; }
.btn.big b { display: block; font-size: 17px; }
.btn.small { display: inline-block; width: auto; padding: 5px 10px; margin: 0 2px; font-size: 13px; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.btn-row.sticky { position: sticky; bottom: 0; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 35%); z-index: 5; }
.icon-btn { background: none; border: 0; font-size: 20px; padding: 6px 10px; cursor: pointer; border-radius: 10px; }
.icon-btn:hover { background: #ffffff12; }

/* ---------- 首頁 ---------- */
.home { max-width: 480px; margin: 0 auto; padding-top: calc(22px + env(safe-area-inset-top, 0px)); }
.logo { text-align: center; margin: 14px 0 10px; }
.logo-title { margin: 6px 0; font-family: var(--display); font-weight: 900; font-size: 60px; letter-spacing: 6px; line-height: 1.1; }
.logo-title span {
  display: inline-block; background: linear-gradient(180deg, #fff6d0, #ffcf4d 45%, #c17616 90%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #5a3000) drop-shadow(0 0 18px #ffb43355); animation: titleIn .7s var(--ease) both, float 4s ease-in-out infinite;
}
.logo-title span:nth-child(1) { animation-delay: 0s, 0s; }
.logo-title span:nth-child(2) { animation-delay: .08s, .5s; }
.logo-title span:nth-child(3) { animation-delay: .16s, 1s; }
.logo-title span:nth-child(4) { animation-delay: .24s, 1.5s; }
.logo-sub { color: var(--muted); letter-spacing: 4px; font-size: 13px; }
.logo-en { color: #f0b42999; letter-spacing: 7px; font-size: 11px; }
/* 英文、法文標題比較長：字小一點、字距窄一點 */
html:not(:lang(zh)) .logo-title { font-size: clamp(32px, 10vw, 46px); letter-spacing: 1px; }
html:not(:lang(zh)) .logo-sub { letter-spacing: 2px; }
.parade { overflow: hidden; margin: 8px 0 14px; mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); }
.parade-track { display: flex; gap: 14px; width: max-content; padding: 8px 0; animation: marquee 50s linear infinite; }
.parade .medal { --s: 46px; }
.names { display: flex; gap: 10px; margin-bottom: 4px; }
.names label, .field { flex: 1; font-size: 12px; color: var(--muted); display: block; margin: 8px 0; }
.names input, .field input, .field textarea, .join-row input {
  display: block; width: 100%; margin-top: 4px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line2);
  background: #0d1128; color: var(--text); font-size: 15px; outline: none; transition: border-color .2s, box-shadow .2s;
}
.field textarea { resize: vertical; min-height: 90px; font-family: inherit; line-height: 1.5; }
.names input:focus, .field input:focus, .field textarea:focus, .join-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #ffcc4d33; }
.mode-grid { display: grid; gap: 10px; margin: 12px 0; }
.mode-btn {
  position: relative; display: grid; grid-template-columns: 52px 1fr; grid-template-rows: auto auto; align-items: center; text-align: left;
  padding: 14px; border-radius: 18px; border: 1px solid var(--line2); cursor: pointer; width: 100%;
  background: linear-gradient(135deg, #263066, #181f45); box-shadow: 0 4px 0 #0007, inset 0 1px 0 #ffffff18; transition: transform .15s var(--ease), box-shadow .15s, border-color .15s;
}
.mode-btn:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 6px 0 #0007, 0 0 24px #ffcc4d22; }
.mode-btn:active { transform: translateY(1px); }
.mode-btn[disabled] { opacity: .5; cursor: default; transform: none; }
.mode-btn.wide { margin: 10px 0; }
.mode-ic { grid-row: span 2; font-size: 30px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #0006; border-radius: 12px; }
.mode-btn b { font-size: 17px; }
.mode-btn small { color: var(--muted); font-size: 12px; }
.or { text-align: center; color: var(--muted); font-size: 12px; margin: 4px 0; }
.join-row { display: flex; gap: 8px; align-items: center; }
.join-row input { margin: 0; flex: 1; text-transform: uppercase; letter-spacing: 8px; text-align: center; font-size: 22px; font-weight: bold; }
.join-row .btn { width: auto; padding: 13px 18px; margin: 0; }
/* 安裝成 App：首頁下方的安裝按鈕／iPhone 加入主畫面提示；網路版大廳的說明 */
.pwa-line { margin-top: 2px; }
.pwa-line .btn { margin: 0; border-color: #ffcc4d66; color: #ffe08a; }
.pwa-hint { margin: 6px 0 0; text-align: center; font-size: 12.5px; color: var(--muted); }
.hosted-note { margin: 10px 0; padding: 8px 10px; border-left: 3px solid var(--p0); border-radius: 8px; background: #55c8ff14; color: #cfe6ff; font-size: 13.5px; }
/* 連線大廳：網路／同一個 Wi-Fi 切換、網路對戰說明、沒有連線伺服器時的 Wi-Fi 玩法、斷線原因 */
.net-pick { text-align: center; margin: 6px 0 4px; }
.net-pick > div { justify-content: center; }
.net-pick .cx-filter { font-size: 14px; padding: 6px 14px; }
.net-pick small { display: block; color: var(--muted); font-size: 12px; }
.net-note { font-size: 12px; color: var(--muted); margin: 14px 0 0; line-height: 1.55; }
.lan-help { margin-top: 12px; font-size: 13px; color: #d5d9ee; }
.lan-help summary { cursor: pointer; color: var(--muted); padding: 4px 0; }
.lan-help ol { padding-left: 20px; margin: 6px 0; }
.site-url { word-break: break-all; }
.net-banner { margin: 8px 0 0; }

/* ---------- 頁面 ---------- */
.page { max-width: 780px; margin: 0 auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: calc(6px + env(safe-area-inset-top, 0px)) 0 6px; position: sticky; top: 0; z-index: 25; background: linear-gradient(#0b0e1cf2, #0b0e1cd0); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid #ffffff0d; }
.topbar .title { font-family: var(--display); font-weight: 900; color: var(--accent); text-align: center; flex: 1; letter-spacing: 1px; text-shadow: 0 0 12px #ffcc4d44; }
.topbar > span { min-width: 42px; display: flex; align-items: center; justify-content: flex-end; }
.net-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 6px; }
.net-dot.ok { background: var(--good); box-shadow: 0 0 8px var(--good); }
.net-dot.bad { background: var(--danger); animation: blink 1s infinite; }
.rules h2 { color: var(--accent); font-size: 18px; margin: 20px 0 6px; font-family: var(--display); }
.rules p, .rules li { color: #d5d9ee; }
.rules ul { padding-left: 20px; }
.card-box { background: linear-gradient(180deg, var(--panel), #12172f); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 12px 0; box-shadow: 0 10px 30px #0006; }
.card-box h3 { margin-top: 0; color: var(--accent); }
.room-code { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
.room-code span { font-size: 40px; font-weight: 900; color: var(--accent); width: 56px; height: 68px; display: flex; align-items: center; justify-content: center; background: #0008; border: 1px solid var(--line2); border-radius: 12px; animation: pop .4s var(--ease) both; }
.room-code span:nth-child(2) { animation-delay: .06s; } .room-code span:nth-child(3) { animation-delay: .12s; } .room-code span:nth-child(4) { animation-delay: .18s; }
.spinner { width: 34px; height: 34px; margin: 12px auto; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }

.banner { background: linear-gradient(180deg, #1d2450, #161c3c); border: 1px solid var(--line2); border-radius: 16px; padding: 12px 14px; margin: 10px 0; text-align: center; font-size: 16px; box-shadow: 0 6px 18px #0005; animation: pop .35s var(--ease); }
.banner small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
.banner.wait { color: var(--muted); }
.dots::after { content: ''; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4) infinite; }
.ptag { font-weight: 800; padding: 0 3px; }
.ptag.p0 { color: var(--p0); text-shadow: 0 0 10px #55c8ff55; }
.ptag.p1 { color: var(--p1); text-shadow: 0 0 10px #ff7d7d55; }

/* ---------- 遮蔽畫面 ---------- */
.cover { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(circle at center, #232b5c, #070915 75%); }
.cover.p0 { box-shadow: inset 0 0 160px #55c8ff40; }
.cover.p1 { box-shadow: inset 0 0 160px #ff7d7d40; }
.cover-box { text-align: center; max-width: 380px; width: 100%; animation: pop .45s var(--ease); }
.cover-icon { font-size: 76px; animation: peek 2.4s ease-in-out infinite; }
.cover h2 { font-size: 24px; font-family: var(--display); }
.cover-what { font-size: 17px; }

/* ---------- 英雄卡 ---------- */
.hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; margin: 10px 0; }
.hero-tile {
  position: relative; border-radius: 16px; padding: 12px 8px 8px; cursor: pointer; text-align: center;
  background: linear-gradient(170deg, color-mix(in srgb, var(--fc) 22%, #1a2042), #141a36 60%);
  border: 1px solid color-mix(in srgb, var(--fc) 40%, var(--line));
  box-shadow: 0 6px 16px #0006, inset 0 1px 0 #ffffff14;
  transition: transform .2s var(--ease), box-shadow .2s, opacity .3s, filter .3s;
  animation: tileIn .45s var(--ease) both; animation-delay: calc(var(--i) * 25ms);
}
.hero-tile:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 26px #0008, 0 0 20px color-mix(in srgb, var(--fc) 35%, transparent); }
.hero-tile .medal { --s: 52px; margin-bottom: 4px; }
.ht-name { font-weight: 800; font-size: 14px; }
.ht-meta { display: flex; justify-content: center; gap: 6px; font-size: 12px; color: #d6dbf3; margin-top: 2px; }
.ht-type { font-size: 11px; color: var(--muted); }
.hero-tile.banned { opacity: .35; filter: grayscale(1); }
.hero-tile.taken { opacity: .55; filter: saturate(.6); }
.hero-tile.taken.p0 { border-color: var(--p0); }
.hero-tile.taken.p1 { border-color: var(--p1); }
.ht-mark { position: absolute; top: 6px; right: 6px; font-size: 11px; padding: 1px 7px; border-radius: 8px; background: #000b; color: var(--danger); font-weight: bold; animation: pop .3s var(--ease); }
.ht-mark.p0 { color: var(--p0); } .ht-mark.p1 { color: var(--p1); }
.pools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pool { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; transition: border-color .3s, box-shadow .3s; }
.pool.turn.p0 { border-color: var(--p0); box-shadow: 0 0 16px #55c8ff33; }
.pool.turn.p1 { border-color: var(--p1); box-shadow: 0 0 16px #ff7d7d33; }
.pool-name { font-size: 13px; margin-bottom: 6px; }
.pool-slots { display: grid; grid-template-columns: repeat(5, minmax(0, 34px)); gap: 4px; }
.pslot { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 1px dashed var(--line2); display: inline-flex; align-items: center; justify-content: center; font-size: 17px; }
.pslot.filled { border: 0; cursor: pointer; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--fc) 55%, #fff 10%), color-mix(in srgb, var(--fc) 30%, #0b0e1c) 70%); box-shadow: 0 0 0 2px color-mix(in srgb, var(--fc) 80%, #000); animation: pop .4s var(--ease); }
.order-strip { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; margin-top: 10px; }
.os-step { width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; background: #0007; border: 2px solid; transition: all .3s var(--ease); }
.os-step.p0 { border-color: #55c8ff88; color: var(--p0); }
.os-step.p1 { border-color: #ff7d7d88; color: var(--p1); }
.os-step.ban { border-style: dashed; color: var(--danger); }
.os-step.done { font-size: 16px; opacity: .6; }
.os-step.done.ban { filter: grayscale(1); }
.os-step.cur { transform: scale(1.18); background: #ffffff18; box-shadow: 0 0 0 2px var(--accent), 0 0 14px #ffcc4d88; animation: bob .8s ease-in-out infinite alternate; }
.os-sep { width: 6px; }
.chip { display: inline-block; background: var(--panel2); border-radius: 999px; padding: 2px 9px; margin: 2px; font-size: 12px; cursor: pointer; border: 1px solid var(--line); }
.opp-pool { margin: 10px 0; font-size: 13px; }

/* ---------- 角色圖鑑 ---------- */
.codex .cx-search { position: sticky; top: calc(52px + env(safe-area-inset-top, 0px)); z-index: 20; padding: 8px 0 6px; background: linear-gradient(var(--bg) 70%, transparent); }
.cx-search input { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line2); background: #0d1128; color: var(--text); font-size: 15px; outline: none; }
.cx-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #ffcc4d33; }
.cx-tabs { display: flex; gap: 8px; margin: 4px 0 8px; }
.cx-tabs button { flex: 1; padding: 9px; border-radius: 12px; border: 1px solid var(--line2); background: #ffffff0a; cursor: pointer; font-weight: bold; }
.cx-tabs button.on { background: linear-gradient(180deg, #ffe07a, #e39713); color: #2a1a00; border-color: #ffd257; }
.cx-filters > div { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; }
.cx-filter { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line2); background: #ffffff08; font-size: 12.5px; cursor: pointer; }
.cx-filter.on { background: #ffcc4d26; border-color: var(--accent); color: var(--accent); font-weight: bold; }
.cx-info { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.cx-info h4 { margin: 12px 0 6px; font-size: 14px; }
.cx-roles { display: flex; gap: 5px; flex-wrap: wrap; }
.cx-role { font-size: 12px; padding: 2px 9px; border-radius: 8px; background: #a56cf22a; color: #d7c6ff; border: 1px solid #a56cf255; }
.cx-sum { margin: 8px 0 4px; color: #dfe4fa; }
.cx-tip { font-size: 13px; background: #ffcc4d14; border-left: 3px solid var(--accent); border-radius: 8px; padding: 6px 9px; color: #f3e6c4; }
.cx-chips { display: flex; flex-direction: column; gap: 5px; }
.cx-chip { display: flex; align-items: center; gap: 8px; text-align: left; padding: 5px 8px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--fc) 40%, var(--line)); background: linear-gradient(90deg, color-mix(in srgb, var(--fc) 14%, #1a2048), #161c3a); cursor: pointer; }
.cx-chip:hover { border-color: var(--accent); }
.cx-chip span { display: flex; flex-direction: column; min-width: 0; }
.cx-chip b { font-size: 13.5px; }
.cx-chip small { font-size: 12px; color: #c4cae6; }
.cx-chip em { font-style: normal; font-size: 11px; color: var(--good); margin-left: auto; white-space: nowrap; }
.cx-combo { background: #ffffff08; border: 1px solid #ffffff12; border-radius: 12px; padding: 8px 10px; margin: 6px 0; }
.cx-combo > b { color: var(--accent); }
.cx-combo .cx-chips { margin: 6px 0; }
.cx-combo p { margin: 4px 0; font-size: 13px; }
.cx-kws { display: grid; gap: 8px; }
/* 提示模式（攻略／挑戰） */
.hint-pick { text-align: center; margin: 8px 0 4px; }
.hint-pick .hint-h { font-size: 12px; color: var(--muted); }
.hint-pick .cx-filters > div { justify-content: center; }
.hint-pick small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.cx-tip.cx-hidden { background: #a56cf214; border-left-color: #a56cf2; color: #d7c6ff; margin-top: 8px; }
/* 我的發現（筆記） */
.notes { display: grid; gap: 8px; margin-top: 8px; }
.note { background: linear-gradient(170deg, #1d2450, #151b38); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin: 6px 0; }
.note-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.note-h b { color: var(--accent); overflow-wrap: anywhere; }
.note-h small { color: var(--muted); font-size: 11px; white-space: nowrap; }
.note p { margin: 6px 0; font-size: 13.5px; color: #dfe4fa; overflow-wrap: anywhere; }
.note-heroes { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.note-heroes .cx-chip { padding: 3px 8px 3px 4px; }
.note-act { display: flex; gap: 6px; justify-content: flex-end; }
.note-add { margin-top: 4px; }
.note-sel { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; min-height: 26px; align-items: center; }
.note-sel .chip { color: var(--text); font: inherit; font-size: 12px; }
.note-picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.note-pick { padding: 2px; border-radius: 50%; border: 2px solid transparent; background: none; cursor: pointer; opacity: .5; justify-self: center; transition: opacity .15s, border-color .15s; }
.note-pick.on { border-color: var(--accent); opacity: 1; }
.cx-kw { background: linear-gradient(170deg, #1d2450, #151b38); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.cx-kw-h { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.cx-kw p { margin: 4px 0 8px; font-size: 13px; color: #cfd5f0; }
.cx-kw .cx-chips { flex-direction: row; flex-wrap: wrap; }
.cx-kw .cx-chip { padding: 3px 8px 3px 4px; }
@media (min-width: 900px) { .cx-kws { grid-template-columns: 1fr 1fr; } }

/* ---------- 出手順序條與新規則標示 ---------- */
.order-bar { margin: 6px 0; padding: 6px 8px; border-radius: 14px; background: linear-gradient(180deg, #0d1230ee, #0a0e26ee); border: 1px solid var(--line2); }
.ob-title { font-size: 10.5px; color: var(--muted); text-align: center; margin-bottom: 4px; }
.ob-list { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 1px; }
.ob-u { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 2px 1px; border-radius: 10px; min-width: 28px; position: relative; }
.ob-u .medal { --s: 26px; }
.ob-u b { font-size: 11px; line-height: 1; }
.ob-u.me .medal { box-shadow: 0 0 0 2px var(--p0), 0 2px 6px #0008; }
.ob-u.foe .medal { box-shadow: 0 0 0 2px var(--p1), 0 2px 6px #0008; }
.ob-u.me b { color: var(--p0); }
.ob-u.foe b { color: var(--p1); }
.ob-u.up { background: #43d17a22; }
.ob-u.up b::after { content: '▲'; color: var(--good); font-size: 9px; margin-left: 1px; }
/* 換位依速度：順序條上我方換位的角色 */
.ob-sw { position: absolute; top: -3px; right: -2px; font-style: normal; font-size: 10px; line-height: 1; filter: drop-shadow(0 1px 1px #000); }
.ob-arrow { font-style: normal; color: #ffffff40; font-size: 11px; width: 6px; text-align: center; }
.tag.basic { background: #ffcc4d33; color: #ffe08a; }
.cards-sub { font-size: 12px; color: var(--muted); margin: 6px 2px 0; border-top: 1px dashed #ffffff22; padding-top: 6px; }
.saved { font-size: 11.5px; color: #9ff0bd; background: #43d17a1f; padding: 1px 7px; border-radius: 8px; font-weight: normal; }
.saved.next { color: #ffe08a; background: #ffcc4d1a; }
.st.cd { opacity: .9; }

/* ---------- 佈陣 ---------- */
.deploy-wrap { display: grid; grid-template-columns: 1fr; gap: 12px; }
.dir-label { text-align: center; color: var(--p1); font-size: 12px; letter-spacing: 3px; margin: 6px 0; animation: blink 2s infinite; }
.dgrid { display: grid; grid-template-columns: 30px 1fr 1fr; gap: 10px; }
.drow-label { writing-mode: vertical-rl; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; letter-spacing: 4px; }
.dcell {
  position: relative; min-height: 110px; border-radius: 16px; text-align: center; padding: 10px 4px; cursor: pointer;
  background: linear-gradient(170deg, color-mix(in srgb, var(--fc, #444) 20%, #1a2042), #141a36);
  border: 2px solid color-mix(in srgb, var(--fc, #444) 50%, var(--line)); transition: border-color .2s, box-shadow .2s, transform .15s;
}
.dcell-in { animation: pop .35s var(--ease); }
.dcell .medal { --s: 48px; }
.dcell .uname { font-weight: 800; margin-top: 4px; }
.dcell.empty { border-style: dashed; display: flex; align-items: center; justify-content: center; color: var(--muted); background: #ffffff06; }
.dcell.empty:hover { background: #ffffff10; }
.dcell.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 0 22px #ffcc4d55; transform: translateY(-2px); }
.dcell .x { position: absolute; top: 5px; right: 5px; background: #000b; border: 0; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; color: #fff; }
/* 站位規則：佈陣提醒（只提醒不擋） */
.dwarn { font-size: 12.5px; color: #ffd9a0; background: #f0a0201a; border: 1px solid #f0a02055; border-radius: 10px; padding: 6px 10px; margin: 10px 0 0; display: flex; flex-direction: column; gap: 4px; }
.meter { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; margin: 12px 2px 6px; font-size: 14px; }
.meter b { color: var(--accent); font-size: 17px; }
.meter-bar { height: 10px; border-radius: 6px; background: #0009; overflow: hidden; box-shadow: inset 0 1px 3px #000; }
.meter-bar i { display: block; height: 100%; background: linear-gradient(90deg, #f0a020, #ffd75e); transition: width .35s var(--ease); }
.meter-bar i.full { background: linear-gradient(90deg, #2fb565, #6cf0a0); }
.meter-bar i.bad { background: var(--danger); }
.roster { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
.rtile { display: flex; background: linear-gradient(170deg, color-mix(in srgb, var(--fc) 16%, #1a2042), #151b38); border: 1px solid color-mix(in srgb, var(--fc) 35%, var(--line)); border-radius: 14px; overflow: hidden; transition: opacity .3s, transform .15s; }
.rtile:hover:not(.used) { transform: translateY(-2px); }
.rtile.used { opacity: .35; filter: grayscale(.8); }
.rmain { flex: 1; background: none; border: 0; text-align: left; padding: 8px; cursor: pointer; display: grid; grid-template-columns: 38px 1fr; column-gap: 8px; align-items: center; }
.rmain .medal { grid-row: span 2; }
.rmain small { color: var(--muted); font-size: 11px; }
.rinfo { background: #0004; border: 0; width: 34px; cursor: pointer; color: var(--muted); }

/* ---------- 戰場 ---------- */
.game-wrap { display: grid; grid-template-columns: 1fr; gap: 12px; padding-top: 6px; }
.board {
  position: relative; border-radius: 20px; padding: 8px 8px 6px;
  background: radial-gradient(ellipse at 50% 50%, #1b2250 0%, #0c1024 75%);
  border: 1px solid var(--line2); box-shadow: 0 12px 40px #0009, inset 0 0 60px #0007;
}
.board::before { content: ''; position: absolute; inset: 0; border-radius: 20px; pointer-events: none; background: linear-gradient(180deg, #ff7d7d10, transparent 30%, transparent 70%, #55c8ff10); }
.side { position: relative; }
.side-head { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 2px 4px; }
.snow { color: #9be7ff; font-size: 12px; background: #9be7ff22; padding: 1px 7px; border-radius: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 7px 0; position: relative; padding-left: 18px; }
.row::before { content: attr(data-label); position: absolute; left: 0; top: 0; bottom: 0; writing-mode: vertical-rl; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #8791bd99; letter-spacing: 2px; }
.cell {
  position: relative; display: flex; gap: 8px; align-items: flex-start; min-height: 82px; border-radius: 14px; padding: 8px 7px 9px; cursor: pointer;
  background: linear-gradient(160deg, color-mix(in srgb, var(--fc, #555) 18%, #1b2246), #141a38 70%);
  border: 1px solid color-mix(in srgb, var(--fc, #555) 45%, var(--line));
  box-shadow: 0 4px 12px #0007, inset 0 1px 0 #ffffff12;
  transition: box-shadow .25s, border-color .25s, transform .25s var(--ease), opacity .4s, filter .4s;
}
.side.top .cell:not(.empty) { box-shadow: 0 4px 12px #0007, inset 0 -2px 0 #ff7d7d55; }
.side.bottom .cell:not(.empty) { box-shadow: 0 4px 12px #0007, inset 0 2px 0 #55c8ff55; }
.cell .medal { --s: 40px; margin-top: 2px; }
.cinfo { flex: 1; min-width: 0; }
.cell.empty { justify-content: center; align-items: center; border: 1px dashed #ffffff1c; background: #ffffff05; box-shadow: none; }
.cell.dead { opacity: .5; filter: grayscale(1); animation: fadeDead .6s var(--ease); }
.uhead { display: flex; align-items: center; gap: 4px; }
.uname { font-weight: 800; font-size: 13px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uspd { font-size: 11px; color: var(--muted); }
.hpbar { position: relative; height: 8px; background: #000b; border-radius: 5px; margin: 5px 0 2px; overflow: hidden; box-shadow: inset 0 1px 2px #000; }
.hpbar.big { height: 10px; margin-bottom: 6px; }
.hpbar i, .hpbar b, .hpbar s { position: absolute; left: 0; top: 0; bottom: 0; display: block; }
.hpbar b.ghost { background: #ffe9a8; transition: width .6s ease-in .35s; }
.hpbar i { background: linear-gradient(180deg, #7ff0a8, var(--hp) 50%, #26a556); transition: width .35s var(--ease); }
.hpbar i.low { background: linear-gradient(180deg, #ff9aa3, var(--low) 50%, #b8232f); }
.hpbar s { background: repeating-linear-gradient(45deg, #6cc0ffdd 0 4px, #9fd8ffdd 4px 8px); transition: left .35s, width .35s; }
.hptxt { font-size: 12px; color: #cfd5f0; }
.hptxt b { color: #fff; }
.sh { color: var(--shield); font-weight: bold; }
.sts { min-height: 17px; font-size: 13px; line-height: 1.25; }
.sts.big { font-size: 22px; }
.st { display: inline-block; margin-right: 1px; animation: pop .35s var(--ease); }
.st sub { font-size: 9px; font-weight: bold; }
.st.future { opacity: .45; }
.plan-chips {
  position: absolute; left: 6px; right: 6px; bottom: -10px; text-align: center; font-size: 11px; z-index: 3;
  background: linear-gradient(180deg, #ffe07a, #f0a020); color: #2a1a00; border-radius: 9px; padding: 1px 6px; font-weight: 800;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 2px 8px #0008; animation: pop .3s var(--ease);
}
.cellfx { position: absolute; top: 3px; right: 5px; font-size: 14px; animation: pop .3s var(--ease); }
.cell.shielded { border-color: var(--shield); box-shadow: 0 0 0 1px #6cc0ff88, 0 0 16px #6cc0ff44, inset 0 0 18px #6cc0ff33 !important; }
.cell.danger .medal { animation: danger 1.2s ease-in-out infinite; }
.cell.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 0 22px #ffcc4d77 !important; transform: translateY(-3px) scale(1.02); z-index: 2; }
.cell.tgt, .tok.tgt { border-color: #ff5a5a; animation: glow .9s ease-in-out infinite alternate; z-index: 2; }
.cell.tgt::after, .tok.tgt::after { content: '🎯'; position: absolute; right: 4px; bottom: 2px; font-size: 16px; animation: bob .9s ease-in-out infinite alternate; }
.cell.actor, .tok.actor { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 0 26px #ffcc4daa !important; z-index: 3; }
.cell.focus { z-index: 3; }
.summons { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px; min-height: 0; }
.tok { position: relative; background: linear-gradient(180deg, #2a3366, #1b2246); border: 1px solid var(--line2); border-radius: 12px; padding: 2px 8px 2px 4px; display: flex; align-items: center; gap: 3px; cursor: pointer; animation: summonIn .45s var(--ease); box-shadow: 0 3px 8px #0007; }
.tok-ic { font-size: 20px; }
.tok small { font-size: 11px; color: #d6dbf3; font-weight: bold; }
.tok small em { color: var(--shield); font-style: normal; }
.tok-st { font-style: normal; font-size: 11px; }
.vs { text-align: center; position: relative; height: 22px; margin: 2px 0; }
.vs::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: linear-gradient(90deg, transparent, #ffcc4d66, transparent); }
.vs span { position: relative; padding: 0 12px; font-size: 13px; color: var(--accent); font-weight: 900; letter-spacing: 4px; font-family: var(--display); background: radial-gradient(ellipse, #141a3a 40%, transparent 70%); }

/* 播放控制列（戰場中央） */
.pb-bar { position: relative; margin: 6px 0; padding: 8px; border-radius: 14px; background: linear-gradient(180deg, #0d1230ee, #0a0e26ee); border: 1px solid var(--line2); box-shadow: 0 6px 20px #0008; z-index: 4; overflow: hidden; }
.cap { min-height: 40px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2px 6px; animation: capIn .25s var(--ease); }
.cap.phase { color: var(--accent); font-family: var(--display); font-size: 17px; letter-spacing: 1px; }
.cap.dmg, .cap.death { color: #ffb6bd; }
.cap.heal { color: #a6ffc6; }
.cap.shield { color: #b4dcff; }
.cap.miss { color: #cfcfcf; }
.cap.act { color: #fff; }
.pbc { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
.pbtn { min-width: 40px; height: 34px; border-radius: 10px; border: 1px solid var(--line2); background: #ffffff10; cursor: pointer; font-size: 15px; }
.pbtn:hover { background: #ffffff22; }
.pbtn.wide { padding: 0 12px; }
.pbc .go { padding: 8px 22px; font-size: 15px; animation: pop .35s var(--ease); }
.pb-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #ffffff10; }
.pb-progress i { display: block; height: 100%; background: linear-gradient(90deg, #f0a020, #ffd75e); transition: width .3s; }

/* 同時揭曉 */
.reveal { position: absolute; inset: 0; z-index: 10; border-radius: 20px; background: #070a1ce6; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 12px; cursor: pointer; animation: fadeIn .25s; }
.reveal-title { text-align: center; font-family: var(--display); font-size: 26px; font-weight: 900; color: var(--accent); text-shadow: 0 0 20px #ffcc4d88; animation: zoomIn .5s var(--ease) .2s both; }
.rlane-name { text-align: center; font-size: 13px; margin-bottom: 6px; }
.rcards { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.rcard { width: 92px; height: 112px; perspective: 600px; animation: dealIn .35s var(--ease) both; animation-delay: calc(var(--i) * 90ms); }
.rc-in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: flipCard .6s var(--ease) both; animation-delay: calc(.55s + var(--i) * 120ms); }
.rc-back, .rc-front { position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6px; box-shadow: 0 6px 16px #000a; }
.rc-back { background: repeating-linear-gradient(45deg, #3a2a7a 0 8px, #2c2060 8px 16px); border: 2px solid #ffcc4d88; font-family: var(--display); font-size: 28px; color: #ffcc4daa; }
.rc-front { transform: rotateY(180deg); background: linear-gradient(170deg, #fff7dc, #f2deaa); color: #2a1a00; border: 2px solid #e2a530; }
.rc-front .cost { position: absolute; left: 4px; top: 4px; width: 22px; height: 22px; font-size: 12px; }
.rc-front .medal { margin-bottom: 4px; box-shadow: 0 0 0 2px var(--fc, #e2a530), 0 2px 6px #0006; }
.rc-front b { font-size: 14px; line-height: 1.2; }
.rc-front small { font-size: 11px; color: #6a4a10; margin-top: 3px; }
.rc-rest { color: var(--muted); padding: 30px 0; }
.rlane.top .rcard { animation-name: dealInTop; }

/* ---------- 操作面板 ---------- */
.panel { background: linear-gradient(180deg, #1a2148f5, #131938f5); border: 1px solid var(--line2); border-radius: 18px; padding: 10px 12px; align-self: start; box-shadow: 0 10px 30px #0008; }
.panel-title { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.ap-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; }
.pips { display: inline-flex; gap: 5px; }
.pips i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #ffcc4d99; display: inline-block; transition: background .25s, box-shadow .25s, transform .25s var(--ease); background: #0006; }
.pips i.on { background: radial-gradient(circle at 35% 30%, #fff3b0, #ffcc4d 50%, #e09312); box-shadow: 0 0 10px #ffcc4daa; transform: scale(1.1); border-color: #ffe08a; }
.pips i.over { background: var(--danger); border-color: var(--danger); }
.ready { color: var(--good); font-size: 12px; margin-left: auto; animation: pop .3s var(--ease); }
.pchips { margin: 8px 0; display: flex; flex-direction: column; gap: 5px; }
.pchip { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: linear-gradient(90deg, #ffcc4d26, #ffcc4d0d); border: 1px solid #ffcc4d55; border-radius: 12px; padding: 4px 4px 4px 10px; font-size: 13px; animation: slideIn .3s var(--ease); }
.pchip b { color: var(--accent); margin-left: 4px; }
/* 站位規則：換位＋近戰可能被打斷、換位速度提示、近戰打格子提示 */
.pc-warn { font-style: normal; font-size: 11px; font-weight: bold; color: #ffb36b; white-space: nowrap; }
.swap-hints { font-size: 12px; color: #cfe6ff; background: linear-gradient(90deg, #55c8ff1f, #55c8ff06); border-left: 3px solid var(--p0); border-radius: 8px; padding: 5px 8px; margin: 6px 0; display: flex; flex-direction: column; gap: 3px; }
.pchip button { background: #0006; border: 0; border-radius: 9px; width: 30px; height: 30px; cursor: pointer; flex: none; }
.hint { background: #ffffff0b; border: 1px solid #ffffff12; padding: 10px 12px; border-radius: 12px; margin: 8px 0; font-size: 14px; animation: fadeIn .3s; }
.hint.glow { border-color: #ff5a5a; color: #ffd6d6; background: #ff5a5a14; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hint.sq { font-size: 12px; padding: 6px 10px; margin-top: -2px; border-color: #ffcc4d44; background: #ffcc4d10; color: #ffe8a8; }
.unit-head { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; flex-wrap: wrap; animation: fadeIn .25s; }
.unit-head b { font-size: 16px; }
.unit-head .btn:first-of-type { margin-left: auto; }
.passive { font-size: 12px; color: #d2c6ff; background: linear-gradient(90deg, #a56cf222, #a56cf208); border-left: 3px solid #a56cf2; border-radius: 8px; padding: 6px 8px; margin: 6px 0; }
.cards { display: flex; flex-direction: column; gap: 7px; margin: 8px 0; }
.card-btn {
  display: flex; gap: 10px; text-align: left; border-radius: 14px; padding: 9px 10px; cursor: pointer; align-items: flex-start;
  background: linear-gradient(170deg, #2a3366, #1d2450); border: 1px solid var(--line2); box-shadow: 0 3px 0 #0007, inset 0 1px 0 #ffffff14;
  transition: transform .15s var(--ease), border-color .15s, box-shadow .15s; animation: cardIn .3s var(--ease) both;
}
.cards .card-btn:nth-child(2) { animation-delay: .04s; } .cards .card-btn:nth-child(3) { animation-delay: .08s; } .cards .card-btn:nth-child(4) { animation-delay: .12s; } .cards .card-btn:nth-child(5) { animation-delay: .16s; }
.card-btn:hover:not([disabled]) { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 5px 0 #0007, 0 0 16px #ffcc4d33; }
.card-btn:active:not([disabled]) { transform: translateY(1px); }
.card-btn.off { opacity: .42; cursor: not-allowed; filter: saturate(.5); }
.card-btn.used { opacity: .65; border-color: var(--accent); }
.cb-main { flex: 1; min-width: 0; }
.cb-title b { font-size: 15px; }
.card-btn small { display: block; color: #c4cae6; font-size: 12px; margin-top: 2px; }
.card-btn small.cb-note { color: #a8e4ff; }
.card-btn em { display: block; color: var(--danger); font-style: normal; font-size: 12px; font-weight: bold; }
.cost { flex: none; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1a6, #ffc93d 45%, #d6880c); color: #2a1a00; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 4px #0008, inset 0 -2px 3px #0003; }
.tag { display: inline-block; font-size: 10px; padding: 0 6px; margin-left: 4px; border-radius: 6px; background: #ffffff1a; color: #cfd5f0; vertical-align: middle; font-weight: bold; }
.tag.pre { background: #55c8ff33; color: #a8e4ff; }
.tag.spd { background: #43d17a33; color: #9ff0bd; }
.tag.aoe { background: #ff7d7d33; color: #ffc0c0; }
.tag.lock { background: #c58bff33; color: #e2c8ff; }
.log-list { max-height: 260px; overflow-y: auto; font-size: 13px; background: #0007; border-radius: 12px; padding: 6px 10px; scroll-behavior: smooth; }
.log-list.tall { max-height: 60vh; }
.lg { padding: 3px 0; border-bottom: 1px solid #ffffff08; color: #c9cfea; }
.lg.phase { color: var(--accent); font-weight: bold; text-align: center; }
.lg.dmg { color: #ffb6bd; }
.lg.death { color: #ff6b77; font-weight: bold; }
.lg.heal { color: #a6ffc6; }
.lg.shield { color: #b4dcff; }
.lg.miss { color: #aaa; }
.lg.act { color: #fff; font-weight: bold; }
.lg.cur { background: #ffcc4d22; border-radius: 6px; padding-left: 4px; animation: slideIn .25s var(--ease); }
.lastlog { margin-top: 10px; }
.lastlog summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; }
.over-panel { text-align: center; }
.over-panel h2 { font-family: var(--display); font-size: 32px; margin: 6px 0; color: var(--accent); text-shadow: 0 0 24px #ffcc4d88; animation: zoomIn .6s var(--ease); }

.confirm-text { font-size: 17px; text-align: center; }

/* ---------- 彈窗 ---------- */
.modal-bg { position: fixed; inset: 0; background: #000b; z-index: 60; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .2s; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.modal { background: linear-gradient(180deg, #1a2148, #11162f); border: 1px solid var(--line2); border-radius: 22px 22px 0 0; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); animation: up .3s var(--ease); box-shadow: 0 -10px 40px #000a; }
.modal h3 { margin: 0; }
.modal .close { margin-top: 12px; }
.detail .d-head { display: flex; gap: 14px; align-items: center; padding: 6px 0 10px; }
.detail h3 { font-size: 22px; font-family: var(--display); }
.d-stats { display: flex; gap: 10px; margin-top: 4px; font-weight: bold; }
.d-stats span { background: #0006; border-radius: 8px; padding: 1px 8px; }
.dcard { background: linear-gradient(170deg, #232b58, #1a2048); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin: 7px 0; }
.dc-head { display: flex; align-items: center; gap: 6px; }

.dc-d { font-size: 13px; color: #c9cfea; margin-top: 4px; }
.live { background: #ffffff0a; border-radius: 12px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
.live ul { margin: 6px 0 0; padding-left: 18px; }
.menu .btn { text-align: left; }

#toast { position: fixed; left: 50%; bottom: calc(30px + var(--sheet-h) + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 40px); background: #000e; border: 1px solid var(--line2); color: #fff; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: all .3s var(--ease); z-index: 99; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 特效圖層 ---------- */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden; }
#fx > div { position: absolute; }
.fx-float { transform: translate(-50%, -50%); font-weight: 900; font-size: 24px; white-space: nowrap; animation: floatUp 1.25s cubic-bezier(.2,.8,.3,1) forwards; text-shadow: 0 2px 0 #000, 0 0 10px #000, 0 0 2px #000; font-family: system-ui, sans-serif; }
.fx-float.dmg { color: #ff5a68; }
.fx-float.dmg.big { font-size: 38px; color: #ff3346; animation-name: floatBig; }
.fx-float.heal { color: #5cff9a; }
.fx-float.shield { color: #8fd0ff; font-size: 20px; }
.fx-float.small { font-size: 15px; }
.fx-float.miss { color: #e8e8e8; font-size: 18px; font-style: italic; }
.fx-float.status { font-size: 13px; padding: 2px 8px; border-radius: 10px; background: #000c; border: 1px solid #ffffff33; text-shadow: none; animation-duration: 1.5s; }
.fx-float.status.debuff { color: #ffb0e0; border-color: #ff7dc080; }
.fx-float.status.buff { color: #a8f0ff; border-color: #6cc0ff80; }
.fx-proj { transform: translate(-50%, -50%); font-size: 26px; filter: drop-shadow(0 0 8px #fff8); will-change: transform; }
.fx-proj.trail { font-size: 20px; filter: blur(1px); }
.fx-slash { width: 90px; height: 6px; transform: translate(-50%, -50%) rotate(-35deg) scaleX(0); border-radius: 4px; background: linear-gradient(90deg, transparent, #fff, var(--sc, #ffcc4d), transparent); box-shadow: 0 0 14px var(--sc, #ffcc4d); animation: slash .35s ease-out forwards; }
.fx-ring { transform: translate(-50%, -50%) scale(.6); border-radius: 18px; border: 3px solid #6cc0ff; box-shadow: 0 0 24px #6cc0ff, inset 0 0 24px #6cc0ff88; animation: ringOut .7s ease-out forwards; }
.fx-ring.act { border-color: var(--accent); box-shadow: 0 0 20px var(--accent); }
.fx-ring.target { border-color: #ff5a5a; box-shadow: 0 0 20px #ff5a5a; }
.fx-particle { transform: translate(-50%, -50%); font-size: 14px; color: #ffe08a; text-shadow: 0 0 6px currentColor; }
.fx-particle.heal { color: #6cff9e; }
.fx-particle.dark { color: #b07dff; }
.fx-particle.rise { font-size: 22px; }
.fx-wave { transform: translate(-50%, -50%); border-radius: 18px; animation: wave .75s ease-out forwards; background: radial-gradient(ellipse at center, #fff8 0%, #ffcc4d66 35%, transparent 70%); }
.fx-wave.fire { background: radial-gradient(ellipse at center, #fff9 0%, #ff6a2088 35%, transparent 70%); }
.fx-wave.ice { background: radial-gradient(ellipse at center, #fff 0%, #8fe3ff99 35%, transparent 70%); }
.fx-wave.abyss { background: radial-gradient(ellipse at center, #fff8 0%, #a56cf299 35%, transparent 70%); }
.fx-wave.holy { background: radial-gradient(ellipse at center, #fff 0%, #fff2b0aa 35%, transparent 70%); }
.fx-bubble { transform: translate(-50%, -100%); white-space: nowrap; font-weight: 900; font-size: 14px; color: #2a1a00; background: linear-gradient(180deg, #fff3c0, #ffcc4d); padding: 3px 10px; border-radius: 10px; box-shadow: 0 4px 12px #000a; animation: bubble 1.1s var(--ease) forwards; }
.fx-banner { transform: translate(-50%, -50%); width: 100vw; text-align: center; animation: bannerIn 1.25s var(--ease) forwards; }
.fx-banner span { display: inline-block; font-family: var(--display); font-weight: 900; font-size: 30px; color: #fff3c4; letter-spacing: 4px; padding: 8px 40px; background: linear-gradient(90deg, transparent, #000c 20%, #000c 80%, transparent); text-shadow: 0 0 16px #ffcc4d, 0 2px 0 #7a4a00; }
.fx-confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; }

/* ---------- 動畫 ---------- */
@keyframes drift { to { transform: translate(240px, 240px); } }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px); } }
@keyframes shine { 0%, 60% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
@keyframes titleIn { from { opacity: 0; transform: translateY(-30px) scale(1.4); } }
@keyframes float { 50% { transform: translateY(-4px); } }
@keyframes marquee { to { transform: translateX(-50%); } }
@keyframes pop { from { opacity: 0; transform: scale(.85); } }
@keyframes tileIn { from { opacity: 0; transform: translateY(14px) scale(.95); } }
@keyframes cardIn { from { opacity: 0; transform: translateX(14px); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } }
@keyframes summonIn { 0% { opacity: 0; transform: scale(0) rotate(-20deg); } 70% { transform: scale(1.2); } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeDead { from { filter: grayscale(0) brightness(1.5); opacity: 1; transform: scale(1.05); } }
@keyframes zoomIn { from { opacity: 0; transform: scale(2); } }
@keyframes capIn { from { opacity: 0; transform: translateY(6px); } }
@keyframes glow { from { box-shadow: 0 0 0 2px #ff5a5a, 0 0 8px #ff5a5a55; } to { box-shadow: 0 0 0 3px #ff5a5a, 0 0 26px #ff5a5acc; } }
@keyframes bob { to { transform: translateY(-3px) scale(1.1); } }
@keyframes danger { 50% { box-shadow: 0 0 0 2px #ff4f5e, 0 0 16px #ff4f5e; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: .35; } }
@keyframes up { from { transform: translateY(60px); opacity: 0; } }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
@keyframes peek { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(-8deg); } 90% { transform: rotate(8deg); } }
@keyframes dealIn { from { opacity: 0; transform: translateY(60px) rotate(8deg); } }
@keyframes dealInTop { from { opacity: 0; transform: translateY(-60px) rotate(-8deg); } }
@keyframes flipCard { from { transform: rotateY(0); } to { transform: rotateY(180deg); } }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.25); } 30% { transform: translate(-50%, -70%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -190%) scale(.95); } }
@keyframes floatBig { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.4); } 18% { opacity: 1; transform: translate(-50%, -60%) scale(1.5); } 35% { transform: translate(-50%, -70%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -170%) scale(1); } }
@keyframes slash { 0% { transform: translate(-50%, -50%) rotate(-35deg) scaleX(0); opacity: 1; } 50% { transform: translate(-50%, -50%) rotate(-35deg) scaleX(1.2); opacity: 1; } 100% { transform: translate(-50%, -50%) rotate(-35deg) scaleX(1.4); opacity: 0; } }
@keyframes ringOut { 0% { opacity: 1; transform: translate(-50%, -50%) scale(.7); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.25); } }
@keyframes wave { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); } }
@keyframes bubble { 0% { opacity: 0; transform: translate(-50%, -60%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -120%) scale(1.1); } 25% { transform: translate(-50%, -115%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -160%); } }
@keyframes bannerIn { 0% { opacity: 0; transform: translate(-30%, -50%) scaleY(.3); } 18% { opacity: 1; transform: translate(-50%, -50%) scaleY(1); } 80% { opacity: 1; transform: translate(-52%, -50%); } 100% { opacity: 0; transform: translate(-75%, -50%); } }

/* ---------- 版面：手機的出招面板是底部抽屜，大螢幕放右側 ---------- */
@media (max-width: 899px) {
  /* 底部抽屜是 position: fixed、滿版寬，不吃 #app 的左右留白 → 自己讓開橫拿手機時的瀏海與圓角 */
  .panel.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; border-radius: 22px 22px 0 0; max-height: 60vh; overflow-y: auto; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); padding-bottom: calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px #000c; animation: up .3s var(--ease); }
  .panel.sheet::before { content: ''; display: block; width: 40px; height: 4px; border-radius: 2px; background: #ffffff30; margin: -2px auto 8px; }
  .panel.sheet.mini { max-height: none; }
}
@media (min-width: 900px) {
  .game-wrap { grid-template-columns: minmax(0, 1.3fr) minmax(330px, 1fr); align-items: start; }
  .panel { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 70px - env(safe-area-inset-top, 0px)); overflow-y: auto; }
  .deploy-wrap { grid-template-columns: 1fr 1fr; }
  .cell { min-height: 96px; }
  .cell .medal { --s: 48px; }
  .modal-bg { align-items: center; }
  .modal { border-radius: 22px; }
  .mode-grid { grid-template-columns: 1fr; }
}
@media (max-width: 460px) {
  .hero-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
  .hero-grid .hc-name { font-size: 12.5px; }
  .hero-grid .hc-en { font-size: 6.5px; letter-spacing: .8px; }
  .hero-grid .hc-stats { font-size: 10px; }
  .hero-grid .hc-stats .ty { display: none; }
  .hero-grid .hc-cost { width: 24px; height: 24px; font-size: 13px; left: 4px; top: 4px; }
  .hero-grid .hc-rar { font-size: 9px; padding: 0 5px; right: 4px; top: 5px; }
  .hero-grid .hc-ph b { font-size: 40px; }
  .hero-grid .hc-plate { margin: -18px 3px 0; padding: 3px 3px 2px; }
  .hero-grid .hc-fac { width: 16px; height: 16px; font-size: 9px; top: -9px; }
  .order-strip { gap: 2px; flex-wrap: nowrap; }
  .os-step { width: 20px; height: 20px; flex: none; font-size: 11px; border-radius: 6px; border-width: 1.5px; }
  .os-step.done { font-size: 12px; }
  .os-sep { width: 3px; flex: none; }
}
@media (max-width: 380px) {
  #app { padding-left: max(6px, env(safe-area-inset-left)); padding-right: max(6px, env(safe-area-inset-right)); }
  .uname { font-size: 12px; }
  .row { padding-left: 14px; gap: 6px; }
  .cell { gap: 5px; padding: 7px 5px 9px; }
  .cell .medal { --s: 32px; }
  .roster { grid-template-columns: 1fr; }
  .logo-title { font-size: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
